# One service now, not two. The API serves the static page at / itself, so there
# is no separate Gradio process to depend on.
#
#   docker compose up      # http://localhost:8000  (page), /docs (API)
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/artifacts/deep.onnx
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
