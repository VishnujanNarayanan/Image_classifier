# Splits what the Dockerfile runs together, so the API can be exercised on its own:
#
#   docker compose up            # both, demo on :7861
#   docker compose up api        # just the service, docs on :8000/docs
services:
  api:
    build: .
    command: uvicorn scripts.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/artifacts/deep.keras
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://127.0.0.1:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  demo:
    build: .
    command: python scripts/demo.py
    ports: ["7861:7861"]
    environment:
      HOST: 0.0.0.0
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
