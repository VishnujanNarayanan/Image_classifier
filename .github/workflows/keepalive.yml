name: Keep the demo warm

# Render's free plan spins a service down after 15 minutes without traffic, and
# waking it takes about a minute. A recruiter clicking the link would pay that.
#
# 750 free instance-hours a month is 31.25 days, so one always-on service fits
# inside the allowance with room to spare. Pinging to stay awake is explicitly
# permitted by Render.
#
# The path matters: Render answers /robots.txt itself while a service is spun
# down, so a ping there never reaches the app and never wakes it. /health does.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RENDER_URL repository variable is not set -- nothing to ping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "$URL/health")
          echo "GET $URL/health -> $code"
          cat /tmp/body 2>/dev/null || true
          echo
          # A cold wake can exceed the timeout; that is not a failure worth a red
          # X, because the request still triggered the spin-up we wanted.
          [ "$code" = "200" ] || echo "::warning::non-200 (service may still be waking)"
